environment: client
data_dir: .data
cors_origins:
  - https://tpra.client.example

providers:
  storage: azure
  metadata: cosmos
  llm: azure_openai
  auth: client_sso
  document_intelligence: azure

local:
  storage_root: .data/files
  sqlite_path: .data/tpra.db

azure:
  storage_connection_string: "${AZURE_STORAGE_CONNECTION_STRING}"
  cosmos_endpoint: "${AZURE_COSMOS_ENDPOINT}"
  cosmos_key: "${AZURE_COSMOS_KEY}"
  cosmos_database: tpra
  openai_endpoint: "${AZURE_OPENAI_ENDPOINT}"
  openai_api_key: "${AZURE_OPENAI_API_KEY}"
  openai_deployment: gpt-4o
  doc_intel_endpoint: "${AZURE_DOC_INTEL_ENDPOINT}"
  doc_intel_key: "${AZURE_DOC_INTEL_KEY}"

observability:
  log_level: INFO
  json_logs: true
